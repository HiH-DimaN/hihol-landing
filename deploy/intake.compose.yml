services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      INTAKE_UPSTREAM: api:8000
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "3000"
    # Mirrors the image HEALTHCHECK so the status is visible to compose/Coolify,
    # not only inside the image. Without it the deploy log reports "Started"
    # for a container that may not serve yet (incident 2026-08-20).
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/healthz >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
    labels:
      - traefik.docker.network=coolify
    networks:
      - coolify
      - intake

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:?set POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:?set POSTGRES_DB}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      ALLOWED_ORIGINS_CSV: https://hihol.ru,https://www.hihol.ru
      RETENTION_DAYS: "365"
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
    networks:
      - intake

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
    volumes:
      - intake-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - intake

volumes:
  intake-db:

networks:
  coolify:
    external: true
  intake:
